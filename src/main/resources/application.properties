spring.application.name=mindconnect

# Porta do servidor (o Render informa a porta na variavel PORT)
server.port=${PORT:8080}

# O Render fica atras de um proxy: com isso o header Location sai com https
server.forward-headers-strategy=framework

# Conexao com o Oracle da FIAP: NAO coloque usuario/senha neste arquivo.
# Defina as variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD (veja o README).
# Sem elas a aplicacao nao inicia, de proposito.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno para nao estourar o limite de conexoes do banco da FIAP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Origens do front-end aceitas pelo CORS: variavel de ambiente CORS_ORIGINS
# (separadas por virgula). Sem ela, o CORS fica liberado para qualquer origem.
